services:
  # MultimediaToolKit - FastAPI Backend Web Service
  # Free tier web service with ephemeral storage & in-process async task handling
  - type: web
    name: mtk-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: mtk-postgres
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: STORAGE_DIR
        value: /tmp/storage

databases:
  # Render Free PostgreSQL (Available for 30-day prototype evaluation)
  - name: mtk-postgres
    plan: free
    region: oregon
    databaseName: multimediatoolkit
    user: postgres
