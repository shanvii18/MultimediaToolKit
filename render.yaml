services:
  # MultimediaToolKit - FastAPI Backend Web Service (Render Free, Tier A)
  #
  # Free-tier limitations (documented in PROJECT_STATUS.md):
  #   - 512 MB RAM, shared CPU; sleeps after 15 min without traffic (~1 min cold start).
  #   - No persistent disk: files in STORAGE_DIR are lost on restart/redeploy/sleep.
  #     Lost files return 410 Gone (never a fake success). Durable object storage is planned.
  #   - Jobs run in the embedded worker thread; they are stored in PostgreSQL, so a sleep or
  #     restart pauses them and they are recovered automatically when the service wakes.
  - type: web
    name: mtk-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      # Persistent PostgreSQL that does NOT expire (e.g. Neon free tier).
      # Render's free PostgreSQL is deleted ~30 days after creation, so it is intentionally not used.
      # Set this value in the Render dashboard (never commit it).
      - key: DATABASE_URL
        sync: false
      # Exact frontend origin(s), e.g. https://your-app.vercel.app (set in dashboard).
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional: regex for Vercel preview URLs, e.g. ^https://your-app(-[a-z0-9-]+)?\.vercel\.app$
      - key: ALLOWED_ORIGIN_REGEX
        value: ""
      - key: FRONTEND_URL
        sync: false
      # Secret for short-lived signed download links. Render generates a random value.
      - key: SIGNING_SECRET
        generateValue: true
      - key: AUTH_MODE
        value: access_key
      - key: EMBEDDED_WORKER
        value: "true"
      # Storage: "local" = ephemeral /tmp on Render Free (files lost on restart -> honest 410).
      # For durable files switch to "s3" and set S3_BUCKET / S3_ENDPOINT_URL / S3_ACCESS_KEY_ID /
      # S3_SECRET_ACCESS_KEY in the dashboard (e.g. Backblaze B2 or Cloudflare R2 free allowance).
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_DIR
        value: /tmp/storage
      # CPU models download on first use into the container (re-downloaded after restarts).
      # Render Free has 512 MB RAM: use the smallest Whisper model; Whisper + Kokoro together
      # may exceed it -- a 2 GB instance or separate worker is recommended for real use.
      - key: MODEL_CACHE_DIR
        value: /tmp/models
      - key: WHISPER_DEFAULT_MODEL
        value: tiny
      # 512 MB: unload Whisper/Kokoro after each job so idle memory stays low.
      - key: KEEP_MODELS_LOADED
        value: "false"
      # Cap engine threads: containers can "see" many host cores, and one encoder/ONNX thread per
      # core multiplies memory. Measured peaks with these caps: <= ~450 MB on short inputs.
      - key: FFMPEG_THREADS
        value: "2"
      - key: WHISPER_CPU_THREADS
        value: "2"
      - key: TTS_CPU_THREADS
        value: "2"
      # Each conversion runs in its own process with a memory watchdog, so a heavy job is stopped
      # (and reported as OUT_OF_MEMORY) instead of crashing the API ("Failed to fetch" for everyone).
      - key: JOB_ISOLATION
        value: "true"
      - key: JOB_MEMORY_LIMIT_MB
        value: "400"
      # fork shares the API's loaded libraries with the job process (saves ~80 MB per job on 512 MB)
      - key: JOB_START_METHOD
        value: fork
      - key: MAX_VIDEO_SCENES
        value: "6"
      # AI modes run on Cloudflare Workers AI. The two credentials are secrets set in the dashboard
      # (sync: false = Blueprint never overwrites them). A hard-coded "none" here once switched AI off
      # on every Blueprint sync, so the provider is declared explicitly.
      - key: AI_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
