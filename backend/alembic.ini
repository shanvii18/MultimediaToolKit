# Alembic configuration. The database URL is NOT stored here: migrations/env.py
# uses the application's resolved DATABASE_URL (app.core.database.db_url).
#
#   cd backend
#   alembic upgrade head            # apply migrations (also done automatically at startup)
#   alembic revision --autogenerate -m "describe change"
#   alembic check                   # verify models and migrations are in sync

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
