services:
  postgres:
    image: postgres:16-alpine
    container_name: mtk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-multimediatoolkit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-multimediatoolkit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mtk-network

  redis:
    image: redis:7-alpine
    container_name: mtk-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mtk-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtk-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-multimediatoolkit}
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mtk-network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: mtk-worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-multimediatoolkit}
      REDIS_URL: redis://redis:6379/0
      POLL_INTERVAL_SECONDS: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mtk-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtk-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - mtk-network

networks:
  mtk-network:
    name: mtk-network
    driver: bridge

volumes:
  postgres_data:
    name: mtk-postgres-data
  redis_data:
    name: mtk-redis-data
